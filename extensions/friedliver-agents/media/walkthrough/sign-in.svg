<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none" role="img" aria-label="Accounts: Claude signed in, Codex not installed, Gemini waiting for sign-in">
	<rect width="520" height="320" rx="14" fill="var(--vscode-editor-background, #060a12)"/>
	<rect x="40" y="36" width="440" height="220" rx="12" fill="var(--vscode-sideBar-background, #0a101b)"/>
	<text x="60" y="66" font-size="14" font-weight="600" fill="var(--vscode-foreground, #e4ecfa)">Agents</text>
	<text x="460" y="66" text-anchor="end" font-size="12" fill="var(--vscode-sideBar-foreground, #aab9d3)">Check again</text>
	<path d="M40 82H480" stroke="var(--vscode-sideBarSectionHeader-border, #18233a)"/>
	<rect x="60" y="96" width="28" height="28" rx="7" fill="var(--vscode-friedliver-agentClaude, #e8b48c)" fill-opacity="0.16"/>
	<text x="74" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="var(--vscode-friedliver-agentClaude, #e8b48c)">C</text>
	<text x="100" y="107" font-size="13" font-weight="600" fill="var(--vscode-foreground, #e4ecfa)">Claude</text>
	<circle cx="104" cy="119" r="3.5" fill="var(--vscode-testing-iconPassed, #6fd6a8)"/>
	<text x="112" y="123" font-size="11" fill="var(--vscode-descriptionForeground, #8092b0)">Signed in</text>
	<path d="M40 138H480" stroke="var(--vscode-sideBarSectionHeader-border, #18233a)"/>
	<rect x="60" y="152" width="28" height="28" rx="7" fill="var(--vscode-friedliver-agentCodex, #86d8c4)" fill-opacity="0.16"/>
	<text x="74" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="var(--vscode-friedliver-agentCodex, #86d8c4)">X</text>
	<text x="100" y="163" font-size="13" font-weight="600" fill="var(--vscode-foreground, #e4ecfa)">GPT (Codex)</text>
	<circle cx="104" cy="175" r="3.5" fill="var(--vscode-descriptionForeground, #8092b0)"/>
	<text x="112" y="179" font-size="11" fill="var(--vscode-descriptionForeground, #8092b0)">Not installed</text>
	<rect x="400" y="154" width="60" height="24" rx="6" fill="var(--vscode-button-secondaryBackground, #111a29)"/>
	<text x="430" y="170" text-anchor="middle" font-size="12" fill="var(--vscode-button-secondaryForeground, #e4ecfa)">Install</text>
	<path d="M40 194H480" stroke="var(--vscode-sideBarSectionHeader-border, #18233a)"/>
	<rect x="60" y="208" width="28" height="28" rx="7" fill="var(--vscode-friedliver-agentGemini, #a9b4ff)" fill-opacity="0.16"/>
	<text x="74" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="var(--vscode-friedliver-agentGemini, #a9b4ff)">G</text>
	<text x="100" y="219" font-size="13" font-weight="600" fill="var(--vscode-foreground, #e4ecfa)">Gemini</text>
	<circle cx="104" cy="231" r="3.5" fill="var(--vscode-button-background, #7cc4ff)"/>
	<text x="112" y="235" font-size="11" fill="var(--vscode-descriptionForeground, #8092b0)">Installed, not signed in</text>
	<rect x="326" y="210" width="134" height="24" rx="6" fill="var(--vscode-button-background, #7cc4ff)"/>
	<text x="393" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="var(--vscode-button-foreground, #03121f)">Sign in with Google</text>
	<text x="260" y="286" text-anchor="middle" font-size="12" fill="var(--vscode-descriptionForeground, #8092b0)">Each sign-in page belongs to the company that runs the agent.</text>

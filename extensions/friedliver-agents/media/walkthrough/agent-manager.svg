	<rect x="180" y="200" width="154" height="74" rx="10" fill="var(--vscode-sideBar-background, #0a101b)"/>
	<rect x="192" y="212" width="18" height="18" rx="5" fill="var(--vscode-list-activeSelectionBackground, #111a29)"/>
	<text x="201" y="225" text-anchor="middle" font-size="10" font-weight="700" fill="var(--vscode-sideBar-foreground, #aab9d3)">D</text>
	<text x="216" y="225" font-size="12" fill="var(--vscode-foreground, #e4ecfa)">Demo</text>
	<text x="192" y="248" font-size="11" fill="var(--vscode-sideBar-foreground, #aab9d3)">Running npm test</text>
	<rect x="192" y="257" width="130" height="4" rx="2" fill="var(--vscode-list-activeSelectionBackground, #111a29)"/>
	<rect x="192" y="257" width="96" height="4" rx="2" fill="var(--vscode-progressBar-background, #b6a6ff)"/>
	<rect x="344" y="118" width="160" height="74" rx="10" fill="var(--vscode-sideBar-background, #0a101b)"/>
	<rect x="356" y="130" width="18" height="18" rx="5" fill="var(--vscode-friedliver-agentCodex, #86d8c4)" fill-opacity="0.16"/>
	<text x="365" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="var(--vscode-friedliver-agentCodex, #86d8c4)">X</text>
	<text x="380" y="143" font-size="12" fill="var(--vscode-foreground, #e4ecfa)">Codex</text>
	<text x="356" y="166" font-size="11" fill="var(--vscode-sideBar-foreground, #aab9d3)">Added 4 tests</text>
	<text x="356" y="181" font-size="11" font-family="var(--vscode-editor-font-family, monospace)" fill="var(--vscode-testing-iconPassed, #6fd6a8)">+31</text>
	<text x="380" y="181" font-size="11" font-family="var(--vscode-editor-font-family, monospace)" fill="var(--vscode-errorForeground, #ff7f90)">−0</text>

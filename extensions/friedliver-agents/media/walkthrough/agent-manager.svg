<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none" role="img" aria-label="The Agent Manager: one task sent to three agents, in Needs you, Working and Done columns">
	<rect width="520" height="320" rx="14" fill="var(--vscode-editor-background, #060a12)"/>
	<rect x="16" y="16" width="488" height="64" rx="10" fill="var(--vscode-sideBar-background, #0a101b)" stroke="var(--vscode-widget-border, #26354f)"/>

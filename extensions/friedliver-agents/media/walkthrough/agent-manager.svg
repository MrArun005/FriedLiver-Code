	<text x="28" y="181" font-size="11" fill="var(--vscode-descriptionForeground, #8092b0)">waiting for review</text>
	<rect x="180" y="118" width="154" height="74" rx="10" fill="var(--vscode-sideBar-background, #0a101b)"/>
	<rect x="192" y="130" width="18" height="18" rx="5" fill="var(--vscode-friedliver-agentGemini, #a9b4ff)" fill-opacity="0.16"/>
	<text x="201" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="var(--vscode-friedliver-agentGemini, #a9b4ff)">G</text>
	<text x="216" y="143" font-size="12" fill="var(--vscode-foreground, #e4ecfa)">Gemini</text>

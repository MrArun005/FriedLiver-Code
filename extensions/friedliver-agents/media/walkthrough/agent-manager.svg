	<text x="86" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="var(--vscode-friedliver-agentGemini, #a9b4ff)">G</text>
	<text x="104" y="64" font-size="11" fill="var(--vscode-descriptionForeground, #8092b0)">3 agents · each in its own worktree</text>
	<rect x="440" y="48" width="52" height="24" rx="6" fill="var(--vscode-button-background, #7cc4ff)"/>
	<text x="466" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="var(--vscode-button-foreground, #03121f)">Run</text>

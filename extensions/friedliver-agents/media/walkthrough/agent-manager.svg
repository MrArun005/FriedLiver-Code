	<rect x="28" y="50" width="20" height="20" rx="5" fill="var(--vscode-friedliver-agentClaude, #e8b48c)" fill-opacity="0.16"/>
	<text x="38" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="var(--vscode-friedliver-agentClaude, #e8b48c)">C</text>
	<rect x="52" y="50" width="20" height="20" rx="5" fill="var(--vscode-friedliver-agentCodex, #86d8c4)" fill-opacity="0.16"/>
	<text x="62" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="var(--vscode-friedliver-agentCodex, #86d8c4)">X</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none" role="img" aria-label="A Demo agent chat: a plan, an edit waiting for review with Accept and Reject">
	<rect width="520" height="320" rx="14" fill="var(--vscode-sideBar-background, #0a101b)"/>
	<rect x="16" y="14" width="120" height="26" rx="7" fill="var(--vscode-list-activeSelectionBackground, #111a29)"/>
	<rect x="22" y="19" width="16" height="16" rx="4" fill="var(--vscode-editor-background, #060a12)"/>
	<text x="30" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="var(--vscode-sideBar-foreground, #aab9d3)">D</text>
	<text x="46" y="31" font-size="12" fill="var(--vscode-foreground, #e4ecfa)">Demo · offline</text>
	<rect x="16" y="54" width="488" height="40" rx="10" fill="var(--vscode-list-activeSelectionBackground, #111a29)"/>
	<text x="30" y="70" font-size="10" font-weight="600" fill="var(--vscode-descriptionForeground, #8092b0)">You</text>
	<text x="30" y="85" font-size="12" font-family="var(--vscode-editor-font-family, monospace)" fill="var(--vscode-foreground, #e4ecfa)">tour</text>
	<rect x="16" y="108" width="16" height="16" rx="4" fill="var(--vscode-list-activeSelectionBackground, #111a29)"/>
	<text x="24" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="var(--vscode-sideBar-foreground, #aab9d3)">D</text>
	<text x="40" y="120" font-size="12" font-weight="600" fill="var(--vscode-foreground, #e4ecfa)">Demo</text>
	<path d="M28 136V262" stroke="var(--vscode-widget-border, #26354f)"/>
	<circle cx="28" cy="144" r="4.5" fill="var(--vscode-testing-iconPassed, #6fd6a8)"/>
	<text x="44" y="148" font-size="12" fill="var(--vscode-sideBar-foreground, #aab9d3)">Read README.md and src/format.ts</text>
	<circle cx="28" cy="170" r="4.5" fill="var(--vscode-testing-iconPassed, #6fd6a8)"/>
	<text x="44" y="174" font-size="12" fill="var(--vscode-sideBar-foreground, #aab9d3)">Planned three steps</text>
	<circle cx="28" cy="196" r="4.5" fill="var(--vscode-button-background, #7cc4ff)"/>
	<text x="44" y="200" font-size="12" fill="var(--vscode-foreground, #e4ecfa)">Edited src/format.ts</text>
	<text x="170" y="200" font-size="11" font-family="var(--vscode-editor-font-family, monospace)" fill="var(--vscode-testing-iconPassed, #6fd6a8)">+8</text>
	<text x="192" y="200" font-size="11" font-family="var(--vscode-editor-font-family, monospace)" fill="var(--vscode-errorForeground, #ff7f90)">−2</text>
	<rect x="44" y="210" width="460" height="40" rx="8" fill="var(--vscode-editor-background, #060a12)" stroke="var(--vscode-button-background, #7cc4ff)" stroke-opacity="0.5"/>
	<text x="58" y="234" font-size="12" fill="var(--vscode-foreground, #e4ecfa)">Waiting for your review</text>
	<rect x="352" y="218" width="64" height="24" rx="6" stroke="var(--vscode-errorForeground, #ff7f90)" stroke-opacity="0.5"/>
	<text x="384" y="234" text-anchor="middle" font-size="12" fill="var(--vscode-errorForeground, #ff7f90)">Reject</text>
	<rect x="424" y="218" width="70" height="24" rx="6" fill="var(--vscode-button-background, #7cc4ff)"/>
	<text x="459" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="var(--vscode-button-foreground, #03121f)">Accept</text>
	<circle cx="28" cy="270" r="4" stroke="var(--vscode-descriptionForeground, #8092b0)" stroke-width="1.4"/>
	<text x="44" y="274" font-size="12" fill="var(--vscode-descriptionForeground, #8092b0)">Run the tests</text>
</svg>

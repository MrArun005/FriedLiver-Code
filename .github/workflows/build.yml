name: Build FriedLiver

# Fetch the pinned upstream, apply FriedLiver's branding and patches, add the
# built-in extensions, build the minified app and its installer for each OS and
# upload them. About an hour per OS, so docs-only changes don't start it.
# A pushed tag vX.Y.Z or vX.Y.Z-N (the upstream version, then FriedLiver's own
# build number) builds the same way and then publishes a GitHub release.
# The Release workflow (release.yml) calls this one with a version, a main commit
# and notes: it builds that commit and publishes the release, creating the tag.
on:
  push:
    branches: [main]
    # Path filters don't apply to tag pushes: a release tag always builds.
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release tag to create, v1.142.0-8
        type: string
        required: true
      sha:
        description: The main commit to build and tag
        type: string
        required: true
      notes:
        description: Release notes (Markdown)
        type: string
        required: true

# Read-only everywhere; only the release job below can write, and only releases.
permissions:
  contents: read

# A build takes most of an hour: a newer push waits for the running build instead of
# cancelling it, and GitHub keeps only the newest waiting push.
concurrency:
  group: fork-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, artifact: friedliver-fork-windows-x64 }
          - { os: macos-latest, target: darwin-arm64, artifact: friedliver-fork-macos-arm64 }
          - { os: ubuntu-latest, target: linux-x64, artifact: friedliver-fork-linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      # Scripts read these as variables, never as ${{ }} pasted into a script.
      ARTIFACT: ${{ matrix.artifact }}
      TARGET: ${{ matrix.target }}
      # Release builds (a tag, or a version from release.yml) stamp the release version into product.json,
      # which the update check compares with GitHub's latest release.
      FRIEDLIVER_VERSION: ${{ inputs.version || github.ref_type == 'tag' && github.ref_name || '' }}
      # Release builds refuse a download that has no pinned checksum (scripts/checksums.json).
      FRIEDLIVER_REQUIRE_PINS: ${{ (inputs.version || github.ref_type == 'tag') && '1' || '' }}
    steps:
      - name: Free disk space (the upstream checkout and build need about 10 GB)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Long paths: upstream's node_modules nest deeply. No CRLF conversion: the patches are LF.
      - name: Git settings for Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      # Packaging strips old Authenticode signatures with signtool before it stamps
      # FriedLiver's name into bundled binaries; signtool comes with the Windows SDK.
      - name: Put the Windows SDK's signtool on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'signtool.exe not found in the Windows SDK' }
          "Using $($tool.FullName)"
          $tool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Pinned to commits; the build never pushes, so the token isn't left in .git/config.
      # Full history with tags: a build of main stamps the newest release it contains (friedliverStamp in scripts/lib.mjs).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          # release.yml's commit; empty (the pushed commit) otherwise.
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # Release builds start from an empty npm cache.
          cache: ${{ !(inputs.version || github.ref_type == 'tag') && 'npm' || '' }}
      # Root packages: the ACP SDK that agent-core/ and the demo agent import.
      - run: npm ci
      - run: node scripts/fetch.mjs
      # The macOS helpers (Swift): the composer mic's speech helper (on-device recognition) and the
      # project index's change journal (FSEvents history), into the Agents extension's bin/,
      # which prepare.mjs copies into the app; build.mjs signs it before the app (finishMacApp).
      - name: Build the macOS helpers
        if: runner.os == 'macOS'
        run: extensions/friedliver-agents/native/build.sh
      - run: node scripts/prepare.mjs
      # A stable macOS signature: the self-signed certificate (MACOS_SIGN_P12) goes into a throwaway
      # keychain and build.mjs signs with it, so the designated requirement names the certificate rather
      # than this build's cdhash, and macOS keeps Desktop/Documents, mic and speech grants across updates.
      # Without the secrets (forks) the app is ad-hoc signed as before. docs/BUILD.md: rotating it.
      - name: Signing keychain (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_SIGN_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "No signing secrets: the app gets an ad-hoc signature."
            exit 0
          fi
          keychain="$RUNNER_TEMP/friedliver-signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          echo "::add-mask::$kc_pass"
          p12="$RUNNER_TEMP/friedliver-signing.p12"
          (umask 077 && printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$p12")
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_SIGN_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "Signing keychain ready."
      # Downloads the Node version upstream's .nvmrc asks for (checked against nodejs.org's SHASUMS256.txt),
      # installs, runs gulp vscode-<os>-<arch>-min, then makes the installer: per-user setup .exe, .dmg or
      # .deb, in installers/.
      - run: node scripts/build.mjs --package --installer
      # Signed with the certificate, the requirement must name its root, never a cdhash (which changes every build).
      - name: Check the signature (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d "VSCode-$TARGET"/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement=$(codesign -d -r- "$app" 2>&1)
          echo "$requirement"
          if [ -n "${MACOS_SIGN_KEYCHAIN:-}" ]; then
            echo "$requirement" | grep -q 'certificate root = H"' || { echo "::error::the designated requirement doesn't name the signing certificate"; exit 1; }
            if echo "$requirement" | grep -q 'cdhash'; then echo "::error::the designated requirement is a cdhash"; exit 1; fi
          fi
      # Patch 0040: a gallery extension installs only after its Open VSX signature checks out against the
      # pinned key. Fails when the check didn't run or didn't succeed, which is also how an Open VSX key
      # renewal shows up (docs/EXTENSION-SIGNATURES.md).
      - name: Install an extension from Open VSX, signature checked (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tmp=$(mktemp -d)
          "VSCode-$TARGET/bin/friedliver" --user-data-dir "$tmp/data" --extensions-dir "$tmp/ext" --log trace \
            --install-extension redhat.vscode-yaml 2>&1 | tee "$tmp/install.log"
          grep -q "Extension 'redhat.vscode-yaml' v.* was successfully installed" "$tmp/install.log" \
            || { echo "::error::redhat.vscode-yaml didn't install"; exit 1; }
          grep -rhE "Extension signature verification result for redhat\.vscode-yaml@[^:]+: Success\." "$tmp/install.log" "$tmp/data/logs" \
            || { echo "::error::the install didn't report a successful Open VSX signature check"; exit 1; }
          rm -rf "$tmp"
      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/friedliver-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain" || true; fi
          rm -f "$RUNNER_TEMP/friedliver-signing.p12"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "$ARTIFACT.tar.gz" "VSCode-$TARGET"
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          # build.mjs already signed the app for the .dmg (the certificate, or ad-hoc without it).
          app=$(ls -d "VSCode-$TARGET"/*.app | head -1)
          ditto -c -k --keepParent "$app" "$ARTIFACT.zip"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "VSCode-$($env:TARGET)/*" -DestinationPath "$($env:ARTIFACT).zip"

      # Portable app (unzip and run) and the installer, as separate downloads.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-installer
          path: installers/*
          if-no-files-found: error

  # For releases only (a tag, or release.yml): the installers and portable apps of this run, with their SHA-256 sums,
  # attached to a GitHub release. The Agents extension checks for it every 4 hours and installs
  # the DMG only when its SHA-256 in SHA256SUMS.txt matches.
  # The workbench visual harness on this run's macOS app, for manual builds (a branch's look):
  # every workbench surface in three themes at 1440x900, and the approved composer checked
  # against its computed-style baseline (scripts/workbench-shots.mjs, artifact workbench-shots).
  shots:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # Playwright comes from the Agents extension's lockfile; only its library is used (no browsers).
      - name: Playwright
        working-directory: extensions/friedliver-agents
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: friedliver-fork-macos-arm64
          path: build
      - name: Unpack the app
        run: |
          ditto -x -k build/friedliver-fork-macos-arm64.zip build/app
          echo "APP=$(ls -d "$PWD"/build/app/*.app | head -1)" >> "$GITHUB_ENV"
      - name: Screenshots
        run: node scripts/workbench-shots.mjs --app "$APP" --out shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: workbench-shots
          path: shots/
          if-no-files-found: warn

  release:
    needs: build
    if: inputs.version || github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: friedliver-fork-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # The app's installer refuses an update whose DMG isn't listed here.
          grep -Eq '  FriedLiver-darwin-arm64-.+\.dmg$' SHA256SUMS.txt || { echo "::error::no macOS arm64 DMG in the release"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.version || github.ref_name }}
          SHA: ${{ inputs.sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Release tags look like v1.142.0 or v1.142.0-2, not $TAG"
            exit 1
          fi
          if [[ -n "$SHA" && ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Not a commit: $SHA"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          elif [ -n "$SHA" ]; then
            # release.yml: the release creates the tag on that commit, so a failed build leaves no tag behind.
            # (A tag made with the workflow token starts no other workflow, so this doesn't build twice.)
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" release/* --target "$SHA" --title "FriedLiver ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" release/* --verify-tag --title "FriedLiver ${TAG#v}" --generate-notes
          fi

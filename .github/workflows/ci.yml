name: CI

# Lint and the theme tests, then the agents extension's tests and both extensions
# as VSIX files for stock VS Code and editors built on it. A pull request runs the
# fast set (Linux only); a push to main and a manual run add macOS and Windows (the agents
# extension's tests on Windows too), and release.yml requires that full run green on main's head.
on:
  push:
    branches: [main]
  pull_request:
  # update-prs.yml starts it on a pull request branch it merged main into: its push
  # (made with the workflow token) starts no workflow by itself.
  workflow_dispatch:

# Read-only token; pull requests from forks get no secrets either (this is not pull_request_target).
permissions:
  contents: read

# A new push cancels the older run on the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commits (Dependabot keeps them current); nothing here pushes, so no credentials stay on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node extensions/friedliver-theme/scripts/generate-themes.mjs --check
      # The FriedLiver Icons font and the FriedLiver Files icons match glyphs.json (built by the hash-locked Python tools).
      - name: Icons are up to date
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/pip" install --require-hashes -r scripts/icon-font-requirements.txt
          PYTHON="$RUNNER_TEMP/icons/bin/python" node scripts/build-icon-font.mjs --check
      # Mac & Windows control on each OS: its tests (programs mocked), the macOS scripts compiled with
      # osacompile, and on Windows the real PowerShell templates with harmless inputs (parse every
      # template, list processes, a clipboard round trip).
      - name: System control tests
        working-directory: extensions/friedliver-agents
        env:
          FRIEDLIVER_SYSTEM_SMOKE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          npm ci
          npx vitest run test/system.test.ts test/systemRequests.test.ts
      # The composer mic's Swift helper compiles (build.yml builds and bundles it).
      - name: Compile the dictation helper
        if: runner.os == 'macOS'
        run: extensions/friedliver-agents/native/build.sh --check

  extensions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Root packages include the ACP SDK the demo agent imports in the tests.
      - run: npm ci && mkdir vsix
      - name: Agents extension
        working-directory: extensions/friedliver-agents
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx -y @vscode/vsce@3.6.0 package --no-dependencies --allow-missing-repository --skip-license -o ../../vsix/friedliver-agents.vsix
      - name: Theme extension
        working-directory: extensions/friedliver-theme
        run: npx -y @vscode/vsce@3.6.0 package --no-dependencies --allow-missing-repository --skip-license -o ../../vsix/friedliver-theme.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: friedliver-vscode-extensions
          path: vsix/*.vsix
          if-no-files-found: error

  # The agents extension's tests on Windows too (launchFor, terminals, guards, paths, index, images, updates):
  # on a push to main and a manual run; pull requests stay Linux-only. Packaging stays in the job above.
  extensions-windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, so a failing command fails the step (pwsh checks only the last one's exit code).
        shell: bash
    steps:
      # The repository's bytes as on macOS and Linux: fixtures and snapshots are LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Agents extension tests
        working-directory: extensions/friedliver-agents
        run: |
          npm ci
          npm run typecheck
          npm test

name: Workbench shots

# The workbench visual harness: download a FriedLiver build for macOS arm64 (the latest release,
# a release tag, or a trusted Build FriedLiver run), screenshot every workbench surface at
# 1440x900 in FriedLiver's dark and light themes and the owner's Dark 2026, check the approved
# chat composer against its computed-style baseline, and upload the screenshots. Pushes to ui/*
# that touch the harness run it against the latest release.
on:
  workflow_dispatch:
    inputs:
      build:
        description: '"latest", a release tag (v1.142.0-5) or a Build FriedLiver run id'
        required: false
        default: 'latest'
      write_baseline:
        description: 'Save the composer styles as the new baseline (artifact only; commit it by hand)'
        type: boolean
        required: false
        default: false
  push:
    branches: ['ui/**']
    paths:
      - '.github/workflows/workbench-shots.yml'
      - 'scripts/workbench-shots.mjs'
      - 'scripts/fetch-build.mjs'
      - 'test/workbench-harness/**'

# Read-only; actions: read lets fetch-build.mjs read a run's artifacts.
permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Inputs reach scripts only as environment variables.
      BUILD: ${{ inputs.build || 'latest' }}
      WRITE_BASELINE: ${{ inputs.write_baseline && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Playwright comes from the Agents extension's lockfile; only its library is used (no browsers).
      - name: Playwright
        working-directory: extensions/friedliver-agents
        run: npm ci --ignore-scripts
      # The token is exposed to this step only: the next one runs the downloaded app.
      - name: Download and verify the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(node scripts/fetch-build.mjs "$BUILD" "$RUNNER_TEMP/build")
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Screenshots
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | grep -i resolution || true
          node scripts/workbench-shots.mjs --app "$APP" --out shots ${WRITE_BASELINE:+--write-baseline}
      - name: Summary
        if: always()
        run: |
          {
            echo "### Workbench shots ($BUILD)"
            if [ -s shots/failures.txt ] && [ "$(tr -d '\n' < shots/failures.txt)" != "" ]; then
              echo '```'; cat shots/failures.txt; echo '```'
            else
              echo "Every surface captured; the composer matches its baseline."
            fi
            echo "Download the **workbench-shots** artifact for the PNGs."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workbench-shots
          path: shots/
          if-no-files-found: warn

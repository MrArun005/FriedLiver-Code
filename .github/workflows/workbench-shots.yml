name: Workbench shots

# The workbench visual harness, on macOS and Windows: download a FriedLiver build (the latest
# release, a release tag, or a trusted Build FriedLiver run), screenshot every workbench surface
# in FriedLiver Dark and Light and the owner's Dark 2026 at 1440x900 and 1280x800, run the design
# gates on the live DOM, record three short motion clips, check the approved chat composer against
# its computed-style baseline (macOS), and upload everything. Pushes to ui/* that touch the harness
# run it against the latest release.
on:
  workflow_dispatch:
    inputs:
      build:
        description: '"latest", a release tag (v1.142.0-5) or a Build FriedLiver run id'
        required: false
        default: 'latest'
      write_baseline:
        description: 'Save the composer styles as the new baseline (artifact only; commit it by hand)'
        type: boolean
        required: false
        default: false
      record:
        description: 'Record the motion clips (palette, tabs, toast)'
        type: boolean
        required: false
        default: true
      strict_gates:
        description: 'Fail the run when a design gate fails (otherwise the gates only report)'
        type: boolean
        required: false
        default: false
  push:
    branches: ['ui/**']
    paths:
      - '.github/workflows/workbench-shots.yml'
      - 'scripts/workbench-shots.mjs'
      - 'scripts/fetch-build.mjs'
      - 'test/workbench-harness/**'

# Read-only; actions: read lets fetch-build.mjs read a run's artifacts.
permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: mac }
          - { os: windows-latest, platform: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # Inputs reach scripts only as environment variables.
      BUILD: ${{ inputs.build || 'latest' }}
      WRITE_BASELINE: ${{ inputs.write_baseline && '1' || '' }}
      STRICT_GATES: ${{ inputs.strict_gates && '1' || '' }}
      # Pushes record too; a dispatch can turn it off.
      RECORD: ${{ github.event_name != 'workflow_dispatch' || inputs.record }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # Playwright comes from the Agents extension's lockfile; only its library is used (no browsers).
      - name: Playwright
        working-directory: extensions/friedliver-agents
        run: npm ci --ignore-scripts
      # The token is exposed to this step only: the next one runs the downloaded app.
      - name: Download and verify the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(node scripts/fetch-build.mjs "$BUILD" "$RUNNER_TEMP/build" "$PLATFORM")
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Screenshots
        run: |
          if [ "$PLATFORM" = mac ]; then
            sw_vers
            system_profiler SPDisplaysDataType | grep -i resolution || true
          fi
          flags=()
          [ -n "$WRITE_BASELINE" ] && flags+=(--write-baseline)
          [ -n "$STRICT_GATES" ] && flags+=(--strict-gates)
          [ "$RECORD" = true ] && flags+=(--record)
          node scripts/workbench-shots.mjs --app "$APP" --out shots "${flags[@]}"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Workbench shots, $PLATFORM ($BUILD)"
            if [ -s "shots/$PLATFORM/failures.txt" ] && [ "$(tr -d '\n' < "shots/$PLATFORM/failures.txt")" != "" ]; then
              echo '```'; cat "shots/$PLATFORM/failures.txt"; echo '```'
            else
              echo "Every surface captured; the composer matches its baseline."
            fi
            if [ -s "shots/$PLATFORM/gates-summary.txt" ]; then
              echo "#### Design gates"
              echo '```'; cat "shots/$PLATFORM/gates-summary.txt"; echo '```'
            fi
            echo "Download the **workbench-shots-$PLATFORM** artifact for the PNGs, gates.json and recordings."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: workbench-shots-${{ matrix.platform }}
          path: shots/
          if-no-files-found: warn

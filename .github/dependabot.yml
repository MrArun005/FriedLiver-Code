version: 2
# Weekly pull requests for the pinned GitHub Actions and the npm lockfiles.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /extensions/friedliver-agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /extensions/friedliver-theme
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
